version: '3.9'

services:
  backend:
    build: .
    container_name: berohotel_backend
    restart: always
    depends_on:
      - redis
      - postgres
    ports:
      - "5000:5000"
    env_file:
      - ./.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}

  postgres:
    image: postgres:15-alpine
    container_name: berohotel_postgres
    restart: always
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: berohotel_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
